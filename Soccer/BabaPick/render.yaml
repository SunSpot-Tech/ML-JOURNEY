services:
  # ── FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: babapick-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: BASE44_PROXY_KEY
        sync: false          # set manually in Render dashboard
      - key: API_FOOTBALL_KEY
        sync: false          # set manually in Render dashboard
      - key: MODEL_PATH
        value: football_prediction_model.pkl
      - key: FD_LEAGUE_CODE
        value: E0
      - key: FD_SEASON_CODE
        value: "2526"
      - key: API_FOOTBALL_LEAGUE
        value: "39"
      - key: API_FOOTBALL_SEASON
        value: "2025"
      - key: XGSCORE_LEAGUE_SLUG
        value: epl
    healthCheckPath: /health

  # ── Streamlit Frontend ───────────────────────────────────────
  - type: web
    name: babapick-ui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE_URL
        value: https://babapick-api.onrender.com   # update to your actual API URL
